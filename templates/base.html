<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="app-shell">

    <aside class="sidebar">

        <nav class="sidebar-nav">
            <a href="/"             class="nav-link {% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">⊞</span> Dashboard
            </a>
            <a href="/add_donor"    class="nav-link {% if request.path == '/add_donor' %}active{% endif %}">
                <span class="nav-icon">＋</span> Add Donor
            </a>
            <a href="/add_donation" class="nav-link {% if request.path == '/add_donation' %}active{% endif %}">
                <span class="nav-icon">♥</span> Record Donation
            </a>
            <a href="/view_stock"   class="nav-link {% if request.path == '/view_stock' %}active{% endif %}">
                <span class="nav-icon">◫</span> View Stock
            </a>
            <a href="/request_blood" class="nav-link {% if request.path == '/request_blood' %}active{% endif %}">
                <span class="nav-icon">↗</span> Request Blood
            </a>
            <a href="/view_donors"  class="nav-link {% if request.path == '/view_donors' %}active{% endif %}">
                <span class="nav-icon">≡</span> View Donors
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h4>{% block header %}{% endblock %}</h4>
        </header>

        <section class="content">
            {% block content %}{% endblock %}
        </section>
    </main>

</div>
</body>
</html>
